<text x="80" y="65" style="fill:#718096;font-family:sans-serif;font-size:13">LOGO CONSTRUCTION / EDITABLE SVG</text><text x="80" y="108" style="fill:#24354b;font-family:sans-serif;font-size:32">NAWA — construction study</text><text x="80" y="142" style="fill:#718096;font-family:sans-serif;font-size:14">X = icon width · 100 SVG units. Original paths + independent annotation layers.</text><text x="80" y="635" style="fill:#24354b;font-family:sans-serif;font-size:15">0.25X = 25-unit horizontal gap      0.2X = 20-unit vertical gap</text><text x="80" y="665" style="fill:#718096;font-family:sans-serif;font-size:13">Select logo → Extensions → Logo Construction. Reference ID: x-reference</text><text x="80" y="688" style="fill:#718096;font-family:sans-serif;font-size:13">Labels remain text. Move them freely; save as Inkscape SVG to keep layer organization.</text></svg>